[package]
name = "general-activity-tracker-rust"
version = "0.1.0"
edition = "2024"
description = "Production-oriented activity tracker built with Axum and MongoDB"
license = "MIT"

[lib]
name = "activity_tracker"
path = "src/lib.rs"

[[bin]]
name = "activity-tracker"
path = "src/main.rs"

[[bin]]
name = "migrate-postgres"
path = "src/bin/migrate_postgres.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bson = { version = "2.15", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
http = "1"
mongodb = "3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
