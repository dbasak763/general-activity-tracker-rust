services:
  neo4j:
    image: neo4j:5.26
    profiles: [ai]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-activity-graph-local}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

  ai:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    profiles: [ai]
    restart: unless-stopped
    environment:
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN:-activity-chat-local-development}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-true}
      LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:8b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_LOOKUP_MODEL: ${GROQ_LOOKUP_MODEL:-openai/gpt-oss-20b}
      GROQ_ANALYSIS_MODEL: ${GROQ_ANALYSIS_MODEL:-openai/gpt-oss-120b}
      GROQ_RELATIONSHIPS_MODEL: ${GROQ_RELATIONSHIPS_MODEL:-openai/gpt-oss-120b}
      GROQ_VISUALIZATION_MODEL: ${GROQ_VISUALIZATION_MODEL:-openai/gpt-oss-120b}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-activity-graph-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - neo4j
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: activity
      MONGO_INITDB_ROOT_PASSWORD: activity
      MONGO_INITDB_DATABASE: activity_tracker
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "activity", "--password", "activity", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      MONGODB_URI: mongodb://activity:activity@mongodb:27017/activity_tracker?authSource=admin
      MONGODB_DATABASE: activity_tracker
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://ai:8090}
      CHAT_INTERNAL_TOKEN: ${CHAT_INTERNAL_TOKEN:-activity-chat-local-development}
      CHAT_MAX_ACTIVITIES: ${CHAT_MAX_ACTIVITIES:-2000}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-165}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      RUST_LOG: activity_tracker=info,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  neo4j_data:
  mongodb_data:
