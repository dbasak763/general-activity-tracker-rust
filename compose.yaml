services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: activity
      MONGO_INITDB_ROOT_PASSWORD: activity
      MONGO_INITDB_DATABASE: activity_tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "activity", "--password", "activity", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      MONGODB_URI: mongodb://activity:activity@mongodb:27017/activity_tracker?authSource=admin
      MONGODB_DATABASE: activity_tracker
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      RUST_LOG: activity_tracker=info,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:

